[project]
name = "valutatrade-hub"
version = "1.0.0"
description = "Консольная платформа для отслеживания и симуляции торговли фиатными и криптовалютами"
readme = "README.md"
authors = [
    { name = "Liza", email = "elizavetabelyankina@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "prettytable>=3.12.0",
]

[project.scripts]
valutatrade-hub = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "valutatrade_hub"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
